name: ruhh
description: RUHH — unified life tracker (budget, habit, prayer, movie).
publish_to: 'none'
version: 1.0.17+18

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  supabase_flutter: ^2.9.0
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_overlay_window: ^0.5.0
  crypto: ^3.0.6
  adhan: ^2.0.0+1
  http: ^1.3.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker: ^8.3.7
  csv: ^6.0.0
  home_widget: ^0.10.0
  fl_chart: ^0.70.2
  math_expressions: ^2.6.0
  flutter_slidable: ^3.1.2
  table_calendar: ^3.2.0
  flutter_animate: ^4.5.2
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  confetti: ^0.8.0
  lottie: ^3.6.1
  neubrutalism_ui:
    path: ../UI

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/icon/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/app_icon.png
  fonts:
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
    - family: PhosphorDuotone
      fonts:
        - asset: assets/fonts/Phosphor-Duotone.ttf
