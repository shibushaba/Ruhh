<!DOCTYPE html>

<body>

<div class="stage">

  <div class="mosaic">
    
<article class="tile wide" style="--c:var(--sky)">
  <div class="wash"></div>

  <div class="count">Prayer is not scored</div>
</article>

    
<article class="tile" style="--c:var(--slate)">

</article>

  <div class="count">Linked, in INR</div>
</article>

    
<article class="tile" style="--c:var(--coral)">
  <div class="wash"></div>
  <svg class="glyph" viewBox="0 0 24 24" style="color:var(--c)"><circle cx="9" cy="9" r="2.2" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="15" cy="9.5" r="1.8" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5 17c.6-2.2 2.2-3.2 4-3.2s3.4 1 4 3.2M13 14.2c.8-.4 1.6-.5 2.4-.4 1.4.2 2.4 1.2 2.8 3.2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>

<nav class="dock" aria-label="Primary">
